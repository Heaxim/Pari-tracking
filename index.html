<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediksi Rute Ikan Pari</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Website Prediksi Rute Ikan Pari</h2>

    <select id="bulanSelect">
        <option value="">-- Pilih Bulan --</option>
        <option value="Januari">Januari</option>
        <option value="Februari">Februari</option>
    </select>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script>
    const map =L.map('map').setView([-0.872, 111.466], 10);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: ' OpenStreetMap contributors'
    }).addTo(map);

    let markers = [];

    fetch('data.json')
    .then(Response => Response.json())
    .then(data => {
        
        document.getElementById("bulanSelect").addEventListener("change", function() {

            markers.forEach(marker => map.removeLayer(marker));
            markers = [];

            const bulanDipilih = this.value;

            const hasilFilter = data.filter(item => item.bulan === bulanDipilih);

            hasilFilter.forEach(item => {
                const marker = L.marker([item.lat, item.lng])
                    .addTo(map)
                    .bindPopup(`
                        <h3>${item.nama}</h3>
                        <img src="${item.foto}" width="200">
                `);
            
                markers.push(marker);
                
            });
        });
    });
    </script>
    
</body>
</html>
